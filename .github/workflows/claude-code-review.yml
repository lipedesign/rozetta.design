name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Skip fork PRs — GitHub does not expose secrets to workflows from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Auth — pick ONE. Default: Console API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # For a Claude subscription instead, remove the line above and use:
          # Or a Console API key: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          use_sticky_comment: true
          prompt: |
            You are reviewing a pull request for **Rozetta** — an open-source
            "Design System OS" (Next.js 16 / React 19 / Supabase / Drizzle /
            DTCG tokens / MCP / Vercel AI SDK). This repo follows
            Specification-Driven Development: the specs in /specs are the source
            of truth.

            Before reviewing, read `AGENTS.md` and only the `specs/` files the
            diff actually touches or depends on (from: constitution.md,
            architecture.md, domain.md, contracts.md, ui-patterns.md) — skip the
            ones a small diff doesn't relate to, to stay within the turn budget.
            Then review the diff and leave focused inline comments. Prioritize, in
            order:

            1. **SDD conformance** — does the change violate a `constitution.md`
               principle or a `domain.md` invariant? If it touches an exported
               signature in `contracts.md`, was the spec updated in the same PR?
               If a feature's behavior changed, was its `specs/features/*.md`
               Status/spec updated?
            2. **Boundaries (AGENTS.md)** — client components must not import
               server-only filesystem/db/bridge modules; workspace mutations must
               call `requireWorkspaceRole`; token trees mutate ONLY via the
               serializer (`setTokenAtPath`/`insertTokenAtPath`/`deleteTokenAtPath`),
               never `set.root[...] = ...`; traversals use the type guards
               (`isDtcgToken`/`isDtcgGroup`); AI calls go through Vercel AI SDK
               adapters; bridge/github spawn is allowlisted (no `shell: true`).
            3. **Security** — auth/workspace scoping gaps, secret leakage
               (`.env*`, `*.local.json` must stay server/local-only), unvalidated
               external input (Figma payloads, MCP/AI tool calls).
            4. **Correctness & tests** — real bugs, missing edge cases, and
               whether acceptance criteria are covered by Vitest tests.

            ## How to deliver the review

            Leave **inline comments** (via `create_inline_comment`) on the exact
            lines, each with a concrete suggestion. Then post **one summary
            comment** with this structure:

            - **Overview** — 1-2 lines on what the PR does and your overall take.
            - **Findings** — grouped by severity, each citing `file:line`:
              - **Bug (must fix)** — correctness/security issues that block merge.
              - **Convention (should fix)** — SDD / AGENTS.md / rule violations.
              - **Robustness (low risk)** — edge cases worth knowing.
            - **What's good** — call out what's done well.
            - **Verdict** — required fixes before merge, or "clean — good to merge".

            Cite `file:line`, propose fixes, distinguish blocking from nits, and
            skip style the linter already enforces. **Write the review in English.**
          claude_args: '--max-turns 40 --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
